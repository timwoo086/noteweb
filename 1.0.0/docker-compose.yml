services:
  javlib:
    build: .
    image: javlib:1.0.0
    container_name: ${CONTAINER_NAME}
    restart: always
    ports:
      - "${PANEL_APP_PORT_HTTP}:5000"
    volumes:
      - ./data:/app/data
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      HTTP_PROXY: ${HTTP_PROXY:-}
      DATA_DIR: /app/data
      PORT: 5000
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
