<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 影片库</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_ver }}">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="{{ url_for('login') }}">
    <div class="login-logo">影片库</div>
    <p class="login-sub">请输入账号和密码</p>
    <input type="text" name="username" placeholder="账号" autofocus autocomplete="username" required>
    <input type="password" name="password" placeholder="密码" autocomplete="current-password" required>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    <button type="submit" class="btn-primary">进入</button>
  </form>
</body>
</html>
